services:
  evaluator:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      PORT: 8110
      EVIDENCE_MODE: simulated
      REGRESSION_TOLERANCE: 0.02
    ports:
      - '8110:8110'
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_eval}
      POSTGRES_USER: ${POSTGRES_USER:-rag_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rag_eval} -d ${POSTGRES_DB:-rag_eval}']
      interval: 5s
      timeout: 3s
      retries: 10
