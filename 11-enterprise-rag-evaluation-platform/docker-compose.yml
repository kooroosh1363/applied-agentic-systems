services:
  evaluator:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      PORT: 8110
      P11_BIND: 0.0.0.0
      P11_DATA_DIR: /app/data
    ports:
      - '127.0.0.1:8110:8110'
    volumes:
      - run_data:/app/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8110/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    profiles: ['postgres']
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_eval}
      POSTGRES_USER: ${POSTGRES_USER:-rag_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rag_eval} -d ${POSTGRES_DB:-rag_eval}']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  run_data:
  postgres_data:
