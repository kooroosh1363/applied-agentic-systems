services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      PORT: 8090
      MOCK_ANALYTICS_MODE: 'true'
    ports:
      - '8090:8090'
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: experiment
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD: local-only-change-me
    volumes:
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U experiment -d experiment']
      interval: 5s
      timeout: 3s
      retries: 10
