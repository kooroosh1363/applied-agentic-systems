services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      PORT: 8200
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/campaign_manager
      DELIVERY_MODE: mock
      EVIDENCE_BOUNDARY: simulated
    ports: ["8200:8200"]
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campaign_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campaign_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9200:9090"]
