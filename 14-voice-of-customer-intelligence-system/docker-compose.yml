services:
  voc:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      PORT: ${PORT:-8140}
      EVIDENCE_MODE: ${EVIDENCE_MODE:-simulated}
    ports: ["${PORT:-8140}:${PORT:-8140}"]
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:8140/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
  n8n:
    image: n8nio/n8n:1.106.3
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports: ["5678:5678"]
    depends_on:
      voc: {condition: service_healthy}
