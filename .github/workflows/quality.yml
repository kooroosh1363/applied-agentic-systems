name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every Docker Compose project
        run: |
          for project in 01-omnichannel-lead-recovery-sla-engine 02-ai-customer-support-command-center 03-appointment-no-show-recovery-engine 04-review-reputation-recovery-system 05-quote-to-cash-automation 06-ai-content-intelligence-engine 07-multi-format-content-production-studio 08-content-repurposing-localization-factory 09-social-publishing-governance-system 10-content-experimentation-revenue-attribution 11-enterprise-rag-evaluation-platform; do
            cp "$project/.env.example" "$project/.env"
            docker compose --env-file "$project/.env" -f "$project/docker-compose.yml" config --quiet
          done
