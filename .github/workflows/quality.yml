name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize non-secret local configuration
        run: cp 01-omnichannel-lead-recovery-sla-engine/.env.example 01-omnichannel-lead-recovery-sla-engine/.env
      - name: Validate Docker Compose
        run: docker compose -f 01-omnichannel-lead-recovery-sla-engine/docker-compose.yml config --quiet
