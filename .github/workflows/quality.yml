name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every Docker Compose project
        run: |
          for project in 01-omnichannel-lead-recovery-sla-engine 02-ai-customer-support-command-center; do
            cp "$project/.env.example" "$project/.env"
            docker compose --env-file "$project/.env" -f "$project/docker-compose.yml" config --quiet
          done
